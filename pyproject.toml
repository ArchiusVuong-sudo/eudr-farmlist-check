[project]
name = "eudr-farmlist-check"
version = "0.1.0"
description = "Checks supplier farm lists for EUDR geolocation problems and forest-loss overlap, on PostGIS"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khanh Vuong Tuan" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "flask>=3.1,<3.2",
  "waitress>=3.0",
  "psycopg[binary]>=3.2",
  "aiosql>=15,<16",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  "claude-agent-sdk>=0.2,<0.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "shapely>=2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls the real model (opt-in with LIVE=1)"]
